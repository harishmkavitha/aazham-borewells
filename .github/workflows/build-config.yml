name: Build website config from Excel
on:
  push:
    paths:
      - 'config/site-config.xlsx'
      - 'tools/xlsx-to-json.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install xlsx@0.18.5
      - run: node tools/xlsx-to-json.mjs config/site-config.xlsx config/site-config.json
      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/site-config.json
          git diff --cached --quiet || git commit -m "Build site config from Excel"
          git push
