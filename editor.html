<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Client Editor</title><link rel="icon" href="assets/img/favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#111;color:#fff}.bar{height:64px;display:flex;gap:10px;align-items:center;padding:10px 14px;background:#171717;border-bottom:1px solid #333;position:sticky;top:0;z-index:9}.bar b{margin-right:auto}.bar select,.bar button{height:38px;border:1px solid #444;border-radius:7px;background:#242424;color:#fff;padding:0 12px}.bar button{cursor:pointer;background:#0f766e;border-color:#0f766e}.bar .ghost{background:#242424;border-color:#555}.hint{font-size:12px;color:#aaa}iframe{width:100%;height:calc(100vh - 64px);border:0;background:#fff}@media(max-width:760px){.bar{height:auto;flex-wrap:wrap}.bar b{width:100%}.hint{display:none}iframe{height:calc(100vh - 110px)}}
</style></head><body><div class="bar"><b>Client Website Editor</b><select id="client"></select><select id="page"></select><button id="open">Open page</button><button class="ghost" id="site">End-user view</button><span class="hint">Click text to edit • click images to replace • use the editor toolbar inside the page to save/rollback.</span></div><iframe id="frame"></iframe><script>
(async()=>{const cfg=await fetch('config/site-config.json',{cache:'no-store'}).then(r=>r.json());const q=new URLSearchParams(location.search);const cs=document.querySelector('#client');Object.entries(cfg.customers).forEach(([id,c])=>{const o=document.createElement('option');o.value=id;o.textContent=c.business.name+' ('+id+')';cs.append(o)});cs.value=q.get('client')||cfg.defaultClient;const ps=document.querySelector('#page');const pages=[['index.html','Home'],['about.html','About'],['drilling-services.html','Drilling Services'],['cleaning-services.html','Cleaning Services'],['gallery.html','Gallery'],['testimonial.html','Testimonials'],['contact.html','Contact']];pages.forEach(([f,n])=>{let o=document.createElement('option');o.value=f;o.textContent=n;ps.append(o)});ps.value=q.get('page')||'index.html';function load(){document.querySelector('#frame').src=ps.value+'?client='+encodeURIComponent(cs.value)+'&editor=1'}document.querySelector('#open').onclick=load;cs.onchange=load;ps.onchange=load;document.querySelector('#site').onclick=()=>window.open('index.html?client='+encodeURIComponent(cs.value),'_blank');load();})();
</script></body></html>
